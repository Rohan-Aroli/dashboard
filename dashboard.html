<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railway Accidents Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #2c3e50;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .upload-section {
      margin-bottom: 30px;
      text-align: center;
    }

    .upload-section input[type="file"] {
      display: none;
    }

    .upload-section label {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      color: #2c3e50;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    .upload-section label:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .upload-section button {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      color: #2c3e50;
      font-size: 1rem;
      margin-left: 10px;
      transition: background 0.3s ease;
    }

    .upload-section button:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .chart {
      width: 40%;
      margin: 20px 0;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .chart:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <h1>Railway Accidents Dashboard</h1>
  <div class="subtitle">Transform raw data into insightful dashboards—upload your JSON file and let the magic begin!</div>

  <!-- Upload Section -->
  <div class="upload-section">
    <input type="file" id="fileInput" accept=".json" />
    <label for="fileInput">Choose JSON File</label>
    <button onclick="handleFileUpload()">Upload</button>
  </div>

  <!-- Visualizations -->
  <div id="accidentsByYear" class="chart"></div>
  <div id="accidentsByLocation" class="chart"></div>
  <div id="deathTollByType" class="chart"></div>
  <div id="accidentsBySeverity" class="chart"></div>
  <div id="top5DeadliestAccidents" class="chart"></div>

  <script>
    let data = [];

    // Function to handle file upload
    function handleFileUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            data = JSON.parse(e.target.result);
            generateDashboard(data);
          } catch (error) {
            alert("Invalid JSON file. Please upload a valid JSON file.");
          }
        };
        reader.readAsText(file);
      } else {
        alert("Please upload a JSON file.");
      }
    }

    // Function to generate the dashboard
    function generateDashboard(data) {
      // 1. Accidents by Year (Line Chart)
      const years = [...new Set(data.map((d) => d.Year))].sort();
      const accidentsByYear = years.map((year) => data.filter((d) => d.Year === year).length);
      const deathTollByYear = years.map((year) =>
        data.filter((d) => d.Year === year).reduce((sum, d) => sum + d["Death Toll"], 0)
      );

      Plotly.newPlot(
        "accidentsByYear",
        [
          {
            x: years,
            y: accidentsByYear,
            name: "Number of Accidents",
            type: "line",
            line: { color: "#3498db" },
          },
          {
            x: years,
            y: deathTollByYear,
            name: "Death Toll",
            type: "line",
            yaxis: "y2",
            line: { color: "#e74c3c" },
          },
        ],
        {
          title: "Accidents and Death Toll by Year",
          xaxis: { title: "Year" },
          yaxis: { title: "Number of Accidents" },
          yaxis2: { title: "Death Toll", overlaying: "y", side: "right" },
          plot_bgcolor: "rgba(255, 255, 255, 0.2)",
          paper_bgcolor: "rgba(255, 255, 255, 0.2)",
        }
      );

      // 2. Accidents by Location (Choropleth Map)
      const locations = data.reduce((acc, d) => {
        acc[d.Location] = (acc[d.Location] || 0) + 1;
        return acc;
      }, {});
      const locationData = Object.keys(locations).map((location) => ({
        location,
        accidents: locations[location],
      }));

      Plotly.newPlot(
        "accidentsByLocation",
        [
          {
            type: "choropleth",
            locations: Object.keys(locations),
            z: Object.values(locations),
            locationmode: "country names",
            colorscale: "Blues",
          },
        ],
        {
          title: "Accidents by Location",
          geo: {
            scope: "asia",
            showcountries: true,
            countrycolor: "rgb(204, 204, 204)",
          },
          plot_bgcolor: "rgba(255, 255, 255, 0.2)",
          paper_bgcolor: "rgba(255, 255, 255, 0.2)",
        }
      );

      // 3. Death Toll by Accident Type (Pie Chart)
      const accidentTypes = data.reduce((acc, d) => {
        const type = d["Accident Description"].split(" ")[0]; // Simplified type extraction
        acc[type] = (acc[type] || 0) + d["Death Toll"];
        return acc;
      }, {});

      Plotly.newPlot(
        "deathTollByType",
        [
          {
            values: Object.values(accidentTypes),
            labels: Object.keys(accidentTypes),
            type: "pie",
            marker: { colors: ["#3498db", "#e74c3c", "#2ecc71", "#f1c40f", "#9b59b6"] },
          },
        ],
        {
          title: "Death Toll by Accident Type",
          plot_bgcolor: "rgba(255, 255, 255, 0.2)",
          paper_bgcolor: "rgba(255, 255, 255, 0.2)",
        }
      );

      // 4. Accidents by Severity (Stacked Bar Chart)
      const severityData = data.reduce(
        (acc, d) => {
          if (d["Death Toll"] > 0) acc.fatal += 1;
          else acc.nonFatal += 1;
          return acc;
        },
        { fatal: 0, nonFatal: 0 }
      );

      Plotly.newPlot(
        "accidentsBySeverity",
        [
          {
            x: ["Fatal", "Non-Fatal"],
            y: [severityData.fatal, severityData.nonFatal],
            type: "bar",
            marker: { color: ["#e74c3c", "#3498db"] },
          },
        ],
        {
          title: "Accidents by Severity",
          xaxis: { title: "Severity" },
          yaxis: { title: "Number of Accidents" },
          plot_bgcolor: "rgba(255, 255, 255, 0.2)",
          paper_bgcolor: "rgba(255, 255, 255, 0.2)",
        }
      );

      // 5. Top 5 Deadliest Accidents (Bar Chart)
      const sortedData = data.sort((a, b) => b["Death Toll"] - a["Death Toll"]).slice(0, 5);

      Plotly.newPlot(
        "top5DeadliestAccidents",
        [
          {
            x: sortedData.map((d) => d["Accident Description"]),
            y: sortedData.map((d) => d["Death Toll"]),
            type: "bar",
            marker: { color: "#e74c3c" },
          },
        ],
        {
          title: "Top 5 Deadliest Accidents",
          xaxis: { title: "Accident Description" },
          yaxis: { title: "Death Toll" },
          plot_bgcolor: "rgba(255, 255, 255, 0.2)",
          paper_bgcolor: "rgba(255, 255, 255, 0.2)",
        }
      );
    }
  </script>
</body>
</html>
